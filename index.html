<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0c0a">
<title>Agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0d0c0a; --panel:#15130f; --card:#1c1914; --card2:#232019; --line:#2f2a21;
  --gold:#c9a45c; --gold2:#e6cd94; --cream:#f3ead8; --muted:#a2998a; --dim:#6f685c;
  --ok:#5cbf86; --warn:#e3a740; --bad:#e2665f; --wa:#25d366; --info:#6fa8dc;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--cream);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--cream);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=date]{color-scheme:dark}
a{color:var(--gold2)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
.wrap.wide{max-width:920px}
h1,h2,h3,.oswald{font-family:Oswald,Inter,sans-serif;font-weight:500;letter-spacing:.02em}
h2{font-size:22px;margin:4px 0 2px}
h3{font-size:17px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11.5px}
.gold{color:var(--gold2)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grow{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.hide{display:none!important}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 4px}
.mnav h3{font-size:20px}
.heroN{background:linear-gradient(135deg,#251f14,#17140e);border:1px solid #4d3f22;border-radius:16px;padding:16px}
.heroN .big{font-family:Oswald;font-size:40px;line-height:1.05;color:var(--gold2);font-weight:500}
.delta{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.delta.up{background:#173324;color:#86d9a8}.delta.down{background:#3a1c1a;color:#f09a94}.delta.eq{background:#2a2a2a;color:#cfcfcf}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi b{display:block;font-family:Oswald;font-size:22px;font-weight:500;color:var(--cream)}
.kpi span{font-size:12px;color:var(--muted)}
.kpi em{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:2px}
.rsec{margin-top:18px}
.rsec>h4{font-family:Oswald;font-weight:500;font-size:16px;color:var(--gold2);margin-bottom:8px;letter-spacing:.02em}
.ins li{list-style:none;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.ins li:last-child{border:0}
.hb{display:grid;grid-template-columns:minmax(78px,30%) 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
.hb .tr{height:10px;background:#26221a;border-radius:4px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--gold);border-radius:0 4px 4px 0;min-width:2px}
.hb .v{color:var(--muted);font-size:12.5px;white-space:nowrap;text-align:right}
.hb .v b{color:var(--cream);font-weight:600}
.vb{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:18px}
.vb .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.vb .c i{display:block;width:100%;max-width:34px;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.vb .c span{font-size:11px;color:var(--dim)} .vb .c em{font-style:normal;font-size:11px;color:var(--muted)}
.vb .c.top i{background:var(--gold2)}
.ph{border-radius:50%;object-fit:cover;border:1.5px solid var(--gold);flex:none;display:block;background:#222}
.avx{border-radius:50%;background:linear-gradient(135deg,#3a3122,#1e1a12);border:1.5px solid var(--gold);display:grid;place-items:center;font-family:Oswald;color:var(--gold2);flex:none}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 10px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.bcard:hover{border-color:#4a4233}
.bcard.sel{border-color:var(--gold);background:#231e14}
.bcard b{font-family:Oswald;font-weight:500;font-size:18px;letter-spacing:.02em}
.bcard .small{line-height:1.3}
.bcard .check{position:absolute;top:10px;right:10px}
.bcard.any{grid-column:1/-1;flex-direction:row;text-align:left;padding:12px 14px}
.upl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.upl input{display:none}
.links .row{border-bottom:1px solid var(--line);padding:10px 0}
.links code{font-size:12px;color:var(--muted);word-break:break-all}
.jn{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--dim);line-height:1.6}
.jn .pro{color:var(--dim);font-size:11px;text-decoration:none;opacity:.7}.jn .pro:hover{opacity:1;text-decoration:underline}
.jn b{color:var(--gold2);font-weight:600;letter-spacing:.02em}
.jn .mk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#c9a45c,#8a6d33);color:#16120a;font-family:Oswald;font-weight:600;font-size:11px;margin-bottom:6px}

/* demo bar */
.demobar{position:sticky;top:0;z-index:20;background:rgba(13,12,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.demobar .in{max-width:920px;margin:0 auto;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.demobar .in::-webkit-scrollbar{display:none}
.demobar .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);white-space:nowrap;margin-right:4px}
.tab{white-space:nowrap;padding:7px 12px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid transparent}
.tab.on{background:var(--gold);color:#16120a;font-weight:600}
.tab:not(.on):hover{border-color:var(--line);color:var(--cream)}

/* hero */
.hero{text-align:center;padding:22px 0 10px}
.logo{width:116px;height:116px;border-radius:50%;object-fit:cover;object-position:center 46%;border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(201,164,92,.08),0 12px 40px rgba(0,0,0,.6)}
.hero h1{font-size:30px;letter-spacing:.14em;margin-top:12px}
.script{font-family:'Great Vibes',cursive;color:var(--gold2);font-size:26px;line-height:1;margin-top:-2px}
.hero p{margin-top:8px}

/* stepper */
.steps{display:flex;gap:6px;margin:18px 0 6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--gold)}
.stephead{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.back:hover{border-color:var(--gold)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:border-color .15s,background .15s}
.opt:hover{border-color:#4a4233}
.opt.sel{border-color:var(--gold);background:#231e14}
.opt .ic{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.opt .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#3a3122,#1e1a12);border:1px solid var(--gold);display:grid;place-items:center;font-family:Oswald;font-size:19px;color:var(--gold2);flex:none}
.opt .price{font-family:Oswald;font-size:18px;color:var(--gold2);white-space:nowrap}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--dim);flex:none;display:grid;place-items:center;font-size:13px}
.sel .check{background:var(--gold);border-color:var(--gold);color:#16120a}

/* dates & times */
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin;scroll-snap-type:x mandatory}
.date{flex:none;width:62px;padding:9px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:center;scroll-snap-align:start}
.date b{display:block;font-family:Oswald;font-size:21px;font-weight:500}
.date span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.date em{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:2px}
.date.sel{border-color:var(--gold);background:#2a2316}
.date.off{opacity:.38}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.time{padding:11px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px;text-align:center}
.time:hover{border-color:#5a5040}
.time.sel{background:var(--gold);color:#16120a;border-color:var(--gold)}
.period{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:14px 0 8px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* form */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.hint{font-size:12px;color:var(--dim);margin-top:5px}

/* footer bar */
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(180deg,rgba(13,12,10,0),var(--bg) 30%);padding:22px 16px 16px}
.footbar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;background:var(--gold);color:#16120a;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #5a2b28}
.btn.wa{background:var(--wa);color:#062b14}
.linkbtn{color:var(--gold2);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* summary */
.sum{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:baseline}
.sum dt{color:var(--muted);font-size:13px}
.sum dd{text-align:right;font-weight:500}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.total b{font-family:Oswald;font-size:26px;color:var(--gold2);font-weight:500}
.strike{text-decoration:line-through;color:var(--dim);margin-right:6px}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.gold{background:#2a2215;border:1px solid #5b4924;color:var(--gold2)}
.banner.info{background:#16202a;border:1px solid #2b4257;color:#bcd6ee}
.banner.warn{background:#2b2113;border:1px solid #6b4d1d;color:#f0c987}
.banner.ok{background:#14241b;border:1px solid #2b5a3e;color:#a9e2c0}

/* loyalty meter */
.meter{display:flex;gap:6px;margin-top:10px}
.meter div{flex:1;text-align:center;font-size:11.5px;color:var(--dim)}
.meter div i{display:block;height:6px;border-radius:6px;background:var(--line);margin-bottom:5px}
.meter div.on{color:var(--gold2)} .meter div.on i{background:var(--gold)}

/* success */
.okcircle{width:74px;height:74px;border-radius:50%;background:#183324;border:2px solid var(--ok);display:grid;place-items:center;margin:26px auto 12px;font-size:34px;color:var(--ok)}
.bubble{background:#0b3d2c;color:#e8f5ee;border-radius:12px 12px 12px 3px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px;max-width:92%}
.bubble.me{background:#2a2a2a;border-radius:12px 12px 3px 12px;margin-left:auto}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-agendado{background:#1d2a38;color:#9cc6ee}
.b-confirmado{background:#173324;color:#86d9a8}
.b-aguardando_remarcacao{background:#3a2b12;color:#f0c27a}
.b-cancelado{background:#3a1c1a;color:#f09a94}
.b-concluido{background:#2a2a2a;color:#cfcfcf}
.b-faltou{background:#3a1c1a;color:#f09a94}

/* agenda list */
.ap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:62px 1fr;gap:12px}
.ap .t{font-family:Oswald;font-size:20px;color:var(--gold2);line-height:1.1}
.ap .t small{display:block;font-family:Inter;font-size:11px;color:var(--dim)}
.ap.dim{opacity:.55}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:Oswald;font-size:22px;font-weight:500;color:var(--gold2)}
.stat span{font-size:11.5px;color:var(--muted)}
.subtabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0}
.subtabs button{flex:1;padding:9px 6px;border-radius:9px;font-size:13.5px;color:var(--muted)}
.subtabs button.on{background:var(--card2);color:var(--cream);font-weight:600}

/* availability */
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.day .h{display:flex;align-items:center;gap:8px 10px;padding:12px 14px;flex-wrap:wrap}
.day .h .nm{width:96px}
.day .h .tm{display:flex;align-items:center;gap:6px;margin-left:auto}
@media(max-width:480px){.day .h .tm{width:100%;margin-left:54px}}
.day .h .nm b{font-family:Oswald;font-weight:500;font-size:16px;display:block;white-space:nowrap}
.day .h select{width:auto;padding:7px 8px;font-size:13.5px}
.day .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.sw{position:relative;width:44px;height:26px;border-radius:26px;background:#3a352b;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfc6b4;transition:left .15s}
.sw.on{background:var(--ok)} .sw.on::after{left:21px;background:#fff}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin-top:12px}
.chip{padding:7px 0;border-radius:8px;font-size:12.5px;text-align:center;border:1px solid #2f5a42;background:#15261c;color:#a9e2c0}
.chip.blk{border-color:#5a2b28;background:#2a1716;color:#e9a19b;text-decoration:line-through}
.chip.bk{border-color:#3b4a5c;background:#18212b;color:#9cc6ee;cursor:not-allowed}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* messages */
.convo{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.convo:hover{background:var(--card)}
.convo .av{width:42px;height:42px;border-radius:50%;background:#1f3b2c;color:#bdf0d2;display:grid;place-items:center;font-weight:700;flex:none}
.phone{background:#0b141a;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;height:560px;max-height:72vh}
.phone .top{background:#1f2c33;padding:10px 12px;display:flex;align-items:center;gap:10px}
.phone .msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:#0b141a}
.phone .msgs .bubble{background:#1f2c33;color:#e9edef;border-radius:3px 12px 12px 12px}
.phone .msgs .bubble.me{background:#005c4b;border-radius:12px 3px 12px 12px}
.phone .msgs .ts{font-size:10px;color:#8696a0;text-align:right;margin-top:3px}
.phone .quick{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;background:#0b141a}
.phone .quick button{flex:none;font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid #2a3942;color:#d1d7db}
.phone form{display:flex;gap:8px;padding:10px;background:#0b141a}
.phone form input{border-radius:999px;background:#2a3942;border-color:#2a3942}
.phone form button{width:44px;height:44px;border-radius:50%;background:#00a884;flex:none;font-size:18px}
.out{border-bottom:1px solid var(--line);padding:12px 0}
.out pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;color:#d9d1c1;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ch{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px}
.ch.whatsapp{background:#123a24;color:#7fe0a4}
.ch.email{background:#1d2a38;color:#9cc6ee}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal{align-items:center}}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:18px 16px 22px}
@media(min-width:640px){.modal .box{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#2a2417;border:1px solid var(--gold);color:var(--cream);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}

.ed{padding:12px 0;border-bottom:1px solid var(--line)}.ed:first-child{padding-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--muted);font-weight:500;font-size:12px}
.sect{margin-top:22px}
.sect>h3{margin-bottom:10px;color:var(--gold2)}
.pinbox{display:flex;gap:8px;justify-content:center;margin:14px 0}
.qrwrap{display:flex;justify-content:center}
#poster{width:100%;max-width:380px;border-radius:16px;border:1px solid var(--line);display:block;margin:0 auto}
</style>
</head>
<body>
<div class="demobar"><div class="in" id="demobar"></div></div>
<div id="app"></div>
<div id="modalRoot"></div>
<script>
/* =========================================================================
   AgendaFácil · J&N Soluções Tecnológicas
   Site de agendamento ligado ao Supabase (versão de produção)
   ========================================================================= */
const SUPA_URL = 'https://uvwqpsvxsvdjkofwiqbk.supabase.co';

const SLUG = (new URLSearchParams(location.search).get('e') || 'impacto').toLowerCase();
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });

const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOWF = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MONF = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const addISO = (s,n) => iso(addDays(parseISO(s),n));
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const toTime = m => pad(Math.floor(m/60))+':'+pad(m%60);
const hm = t => (t||'').slice(0,5);
const fmtDate = s => { const d=parseISO(s); return DOW[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1); };
const fmtLong = s => { const d=parseISO(s); return DOWF[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1); };
const money = v => 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const digits = s => (s||'').replace(/\D/g,'');
const fmtPhone = s => { const d=digits(s); if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return s||''; };
const maskPhone = v => { const d=digits(v).slice(0,11); if(d.length<=2) return d.length?'('+d:''; if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`; if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first = n => (n||'').trim().split(/\s+/)[0];
const weekStart = s => { const d=parseISO(s), w=d.getDay(); return iso(addDays(d, w===0?-6:1-w)); };
const fmtBirth = s => { if(!s) return '—'; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const svcNames = a => (a.servicos||[]).map(s=>s.nome).join(' + ');
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args||{});
  if(error){ console.error(fn, error); throw new Error(error.message || 'Erro de conexão'); }
  return data;
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function loading(msg){ app.innerHTML=`<div class="wrap"><div class="empty mt24">⏳ ${esc(msg||'Carregando…')}</div></div>`; }
function modal(html,onMount){ const root=$('#modalRoot'); root.innerHTML=`<div class="modal"><div class="box">${html}</div></div>`; const m=root.firstChild; m.addEventListener('click',e=>{ if(e.target===m) closeModal(); }); onMount&&onMount(m.querySelector('.box')); }
function closeModal(){ $('#modalRoot').innerHTML=''; }
function confirmBox(title,text,okLabel,danger,withReason){
  return new Promise(res=>{
    modal(`<h3>${title}</h3><p class="muted mt8">${text}</p>${withReason?`<label class="f mt12"><span>Motivo (opcional, vai na mensagem ao cliente)</span><input id="cbReason" placeholder="ex.: problema de saúde"></label>`:''}
      <div class="row mt16"><button class="btn ghost grow" id="cbNo">Voltar</button><button class="btn grow ${danger?'danger':''}" id="cbOk">${okLabel}</button></div>`, box=>{
      box.querySelector('#cbNo').onclick=()=>{closeModal();res(false);};
      box.querySelector('#cbOk').onclick=()=>{ const r=box.querySelector('#cbReason'); closeModal(); res(withReason?{reason:r?r.value.trim():''}:true); };
    });
  });

function jnFooter(){

new MutationObserver(()=>{ const w=app.querySelector('.wrap'); if(w && !w.querySelector('.jn')) w.insertAdjacentHTML('beforeend',jnFooter()); }).observe(app,{childList:true});
function resizeImage(file,size){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
      const sq=Math.min(img.width,img.height), sx=(img.width-sq)/2, sy=(img.height-sq)*0.25; x.drawImage(img,sx,sy,sq,sq,0,0,size,size); res(c.toDataURL('image/jpeg',0.82)); };
      img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}

/* ---------- estado global ---------- */
let EMP = null;        // dados públicos da empresa
let ME = null;         // retorno de vincular_conta (logado)
let route = 'agendar';
const isStaff = () => !!(ME && (ME.admin || ME.profissional));
const isAdmin = () => !!(ME && ME.admin);
const myProf = () => ME && ME.profissional;
const canAll = () => isAdmin() || !!(myProf() && (myProf().ver_todos || myProf().dono));
const isOwner = () => isAdmin() || !!(myProf() && myProf().dono);
const hoje = () => (EMP && EMP.hoje) || iso(new Date());
const svc = id => (EMP.servicos||[]).find(s=>s.id===id);
const durOf = ids => ids.reduce((s,id)=>s+((svc(id)||{}).blocos||1)*EMP.duracao_min,0);
const priceOf = ids => ids.reduce((s,id)=>s+Number((svc(id)||{}).preco||0),0);
const profPub = id => (EMP.profissionais||[]).find(p=>p.id===id) || (P.profs||[]).find(p=>p.id===id) || {nome:'?'};
const linkCliente = () => location.origin + location.pathname + (SLUG!=='impacto'?`?e=${SLUG}`:'');

/* ---------- rotas ---------- */
const ROUTES = [['agendar','Agendar',0],['meus-horarios','Meus horários',0],['profissional','Painel',1],['admin','Administrador',2]];
function level(){ return isAdmin()?2:isStaff()?1:0; }
function renderBar(){
  const lv=level(), vis=ROUTES.filter(r=>r[2]<=lv);

function go(r){ if(location.hash!=='#'+r) location.hash=r; else render(); }
window.addEventListener('hashchange',()=>render());
function render(){

let B;
function newBooking(){ B={step:1,services:[],bid:null,date:null,time:null,pickedBid:null,phone:'',name:'',birth:'',dias:null,horarios:null,previa:null,done:null,busy:false}; }
newBooking();

function pickerHTML(dias,date,horarios,time){
  const chips=(dias||[]).map((x,i)=>{ const d=parseISO(x.data); const lbl=x.data===hoje()?'Hoje':x.data===addISO(hoje(),1)?'Amanhã':DOW[d.getDay()];
    const sub=!x.publicado?'fechado':x.livres?`${x.livres} livres`:'lotado';
    return `<button class="date ${date===x.data?'sel':''} ${x.livres?'':'off'}" data-date="${x.data}" ${x.livres?'':'disabled'}><span>${lbl}</span><b>${pad(d.getDate())}</b><em>${sub}</em></button>`; }).join('');
  let times='';
  if(!dias) times='<div class="empty">⏳ Carregando dias…</div>';
  else if(!date) times='<div class="empty">Nenhum horário livre nos próximos dias. Tente outro barbeiro.</div>';
  else if(!horarios) times='<div class="empty">⏳ Carregando horários…</div>';
  else if(!horarios.length) times='<div class="empty">Sem horários livres neste dia.</div>';
  else { const groups=[['Manhã',x=>toMin(x)<720],['Tarde',x=>toMin(x)>=720&&toMin(x)<1080],['Noite',x=>toMin(x)>=1080]];
    for(const [g,f] of groups){ const l=horarios.filter(h=>f(h.hora)); if(!l.length) continue;
      times+=`<div class="period">${g}</div><div class="times">`+l.map(h=>`<button class="time ${time===h.hora?'sel':''}" data-time="${h.hora}" data-bid="${h.profissional_id}">${h.hora}</button>`).join('')+`</div>`; } }
  return `<div class="dates">${chips}</div>${times}<p class="hint mt12">A agenda é liberada semanalmente pelos barbeiros.</p>`;
}

      <div class="total"><span class="muted">Total ${pct?`<span class="badge b-confirmado">-${pct}%</span>`:''}</span><span>${pct?`<span class="strike">${money(total)}</span>`:''}<b>${money(fin)}</b></span></div></div>
      ${pct?`<div class="banner gold mt12">🎁 ${n}ª visita em ${MONF[parseISO(B.date).getMonth()]}: você ganhou ${pct}% de desconto fidelidade!</div>`:''}

  </div>
  <div class="footbar"><div class="in">${B.services.length?`<div><div class="tiny dim">${dur} min</div><div class="oswald gold" style="font-size:20px">${money(fin)}</div></div>`:''}<button class="btn grow" id="nx" ${canNext?'':'disabled'}>${nextLbl}</button></div></div>`;
  const bk=$('#bk'); if(bk) bk.onclick=()=>{ B.step--; viewBooking(); };
  $('#nx').onclick=async()=>{
    if(B.step===5) return confirmBooking();

  app.querySelectorAll('.opt-b').forEach(b=>b.onclick=()=>{ B.bid=b.dataset.bid; B.dias=null;B.date=null;B.time=null;B.horarios=null; viewBooking(); });
  if(B.step===3) bindPick();
  if(B.step===4){
    const ph=$('#fPhone'), nm=$('#fName'), bd=$('#fBirth');

function bindPick(){
  const root=$('#pick'); if(!root) return;
  root.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{ B.date=b.dataset.date; B.time=null; B.horarios=null; refreshPick(); loadHorarios(); });
  root.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{ B.time=b.dataset.time; B.pickedBid=b.dataset.bid; refreshPick(); $('#nx').disabled=false; $('#nx').scrollIntoView({behavior:'smooth',block:'end'}); });
  const s=root.querySelector('.date.sel'); if(s) s.scrollIntoView({inline:'center',block:'nearest'});
}
function refreshPick(){ const r=$('#pick'); if(!r) return; r.innerHTML=pickerHTML(B.dias,B.date,B.horarios,B.time); bindPick(); const n=$('#nx'); if(n) n.disabled=!B.time; }
async function loadDias(){
  try{
    B.dias = await rpc('public_dias',{p_slug:SLUG, p_prof:B.bid==='any'?null:B.bid, p_duracao:durOf(B.services)});
    const f=B.dias.find(x=>x.livres>0); B.date=f?f.data:null; refreshPick(); if(B.date) loadHorarios();
  }catch(e){ toast('Não foi possível carregar a agenda. Verifique sua internet.'); }
}
async function loadHorarios(){
  const d=B.date;
  try{ const h=await rpc('public_horarios',{p_slug:SLUG, p_prof:B.bid==='any'?null:B.bid, p_data:d, p_duracao:durOf(B.services)});
    if(B.date===d){ B.horarios=h; refreshPick(); } }catch(e){ toast('Erro ao carregar horários'); }
}
function validData(){ const d=digits(B.phone); return (d.length===10||d.length===11) && B.name.trim().length>=3 && !!B.birth; }
async function loadPrevia(){
  try{ B.previa = await rpc('public_previa_desconto',{p_slug:SLUG,p_telefone:digits(B.phone),p_nascimento:B.birth,p_data:B.date}); }catch(e){ B.previa=null; }
}
async function confirmBooking(){
  B.busy=true; viewBooking();
  try{
    const r=await rpc('public_agendar',{p_slug:SLUG,p_servicos:B.services,p_prof:B.bid==='any'?null:(B.pickedBid||B.bid),p_data:B.date,p_hora:B.time,p_nome:B.name.trim(),p_telefone:digits(B.phone),p_nascimento:B.birth});
    B.busy=false;
    if(!r || !r.ok){ toast((r&&r.erro)||'Não foi possível agendar'); if(r && /ocupado/i.test(r.erro)){ B.step=3; B.time=null; B.horarios=null; B.dias=null; viewBooking(); loadDias(); } else viewBooking(); return; }
    B.done=r; viewBooking();
  }catch(e){ B.busy=false; toast('Sem conexão. Tente de novo.'); viewBooking(); }
}

    <div class="row mt16"><button class="btn ghost grow" onclick="go('meus-horarios')">Meus horários</button><button class="btn grow" id="again">Agendar outro</button></div></div>`;

function mineList(){

function bindMine(){
  app.querySelectorAll('[data-cx]').forEach(b=>b.onclick=async()=>{ const a=M.list[+b.dataset.cx];
    if(!await confirmBox('Cancelar horário?',`${fmtLong(a.data)} às ${a.hora} com ${esc(a.profissional)}. O horário será liberado.`,'Sim, cancelar',true)) return;

async function clientReschedule(a){
  const st={dias:null,date:null,horarios:null,time:null};
  const draw=box=>{
    box.innerHTML=`<div class="row between"><h3>Remarcar</h3><button class="back" id="mx">✕</button></div>
      <p class="small muted mt8">Atual: ${fmtLong(a.data)} às ${a.hora} com ${esc(a.profissional)}</p>
      <div class="mt12" id="mp">${pickerHTML(st.dias,st.date,st.horarios,st.time)}</div>
      <button class="btn full mt16" id="mok" ${st.time?'':'disabled'}>${st.time?`Remarcar para ${fmtDate(st.date)} às ${st.time}`:'Escolha um horário'}</button>`;
    box.querySelector('#mx').onclick=closeModal;
    box.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{ st.date=b.dataset.date; st.time=null; st.horarios=null; draw(box); loadH(box); });
    box.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{ st.time=b.dataset.time; draw(box); });
    box.querySelector('#mok').onclick=async()=>{ try{ const r=await rpc('public_remarcar',{p_slug:SLUG,p_codigo:a.codigo,p_telefone:digits(M.phone),p_data:st.date,p_hora:st.time});
      if(!r.ok) return toast(r.erro); closeModal(); toast('Remarcado!'); $('#mGo').click(); }catch(e){ toast('Erro de conexão'); } };
  };
  const loadH=async box=>{ const d=st.date; const h=await rpc('public_horarios_remarcar',{p_slug:SLUG,p_codigo:a.codigo,p_telefone:digits(M.phone),p_data:d}); if(st.date===d){ st.horarios=h; draw(box); } };
  modal('',async box=>{ draw(box);
    st.dias=await rpc('public_dias',{p_slug:SLUG,p_prof:a.profissional_id,p_duracao:a.duracao});
    const f=st.dias.find(x=>x.livres>0); st.date=f?f.data:null; draw(box); if(st.date) loadH(box); });
}

    sb.from('agendamentos').select('data,hora,duracao,status').eq('profissional_id',pid).gte('data',ws).lte('data',we)]);
  const published=(disp||[]).length>0;
  if(!draft){ draft={}; for(let i=0;i<7;i++){ const k=addISO(ws,i), v=(disp||[]).find(d=>d.data===k);
    draft[k]=v?{aberto:v.aberto,inicio:hm(v.inicio),fim:hm(v.fim),bloqueados:(v.bloqueados||[]).map(hm)}:{aberto:false,inicio:hm(EMP_CFG().abre),fim:hm(EMP_CFG().fecha),bloqueados:[]}; } }
  const step=EMP.duracao_min;
  const opts=sel=>{ let o=''; for(let m=6*60;m<=22*60;m+=step) o+=`<option ${toTime(m)===sel?'selected':''}>${toTime(m)}</option>`; return o; };

      ${v.aberto?`<div class="tm"><select data-st="${k}" ${past?'disabled':''}>${opts(v.inicio)}</select><span class="dim">às</span><select data-en="${k}" ${past?'disabled':''}>${opts(v.fim)}</select><button class="btn sm ghost" data-exp="${k}">${openDay===k?'Fechar ▲':'Bloquear horários'}</button></div>`:''}</div>
      ${v.aberto&&openDay===k?`<div class="body"><div class="chips">${chips}</div><p class="hint">Toque para bloquear (almoço, compromisso). Toque de novo para liberar.</p></div>`:''}</div>`; });
  $('#bBody').innerHTML=`${!myProf()?`<label class="f mt8"><span>Barbeiro</span><select id="apSel">${P.profs.filter(p=>p.ativo).map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label>`:''}
    <div class="subtabs" style="margin:8px 0">${['Esta semana','Próxima semana','Em 2 semanas'].map((l,i)=>`<button class="${bWeek===i?'on':''}" data-wk="${i}">${l}</button>`).join('')}</div>
    <div class="row between"><b class="oswald" style="font-size:18px">${fmtDate(ws).slice(5)} a ${fmtDate(we).slice(5)}</b>${published?'<span class="badge b-confirmado">Publicada</span>':'<span class="badge b-aguardando_remarcacao">Não publicada</span>'}</div>

    <div class="mt12">${days}</div>
    <button class="btn full mt12" id="pub">${published?'Salvar alterações':'Publicar semana para os clientes'}</button>
    <p class="hint">Domingo é o dia de programar a semana seguinte. Atendimentos de ${step} em ${step} minutos.</p>`;
  const R=$('#bBody'), redraw=()=>panelAvail(me);
  const sel=$('#apSel'); if(sel) sel.onchange=()=>{ availProf=sel.value; draft=null; redraw(); };

  $('#tpl').onclick=()=>{ const c=EMP_CFG(); Object.keys(draft).forEach(k=>{ if(k<t) return; Object.assign(draft[k],{aberto:(c.dias_semana||[1,2,3,4,5,6]).includes(parseISO(k).getDay()),inicio:hm(c.abre),fim:hm(c.fecha),bloqueados:[]}); }); redraw(); toast('Horário padrão aplicado. Revise e publique.'); };
  $('#cpy').onclick=async()=>{ const {data:prev}=await sb.from('disponibilidade').select('*').eq('profissional_id',pid).gte('data',addISO(ws,-7)).lte('data',addISO(ws,-1));
    Object.keys(draft).forEach(k=>{ if(k<t) return; const p=(prev||[]).find(x=>x.data===addISO(k,-7)); draft[k]=p?{aberto:p.aberto,inicio:hm(p.inicio),fim:hm(p.fim),bloqueados:(p.bloqueados||[]).map(hm)}:{...draft[k],aberto:false}; }); redraw(); toast('Semana anterior copiada. Revise e publique.'); };
  $('#pub').onclick=async()=>{

}

const ymShift=(ym,n)=>{ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const ymLabel=ym=>{ const [y,m]=ym.split('-').map(Number); const n=MONF[m-1]; return n[0].toUpperCase()+n.slice(1)+' de '+y; };
const pct=(a,b)=>b?Math.round(a/b*100):0;
function stats(rows,ym,cutDay){
  const tk=hoje(), list=rows.filter(a=>a.data.slice(0,7)===ym&&(!cutDay||Number(a.data.slice(8))<=cutDay));
  const done=list.filter(a=>a.status==='concluido'), noshow=list.filter(a=>a.status==='faltou'), canc=list.filter(a=>a.status==='cancelado');
  const up=list.filter(a=>['agendado','confirmado','aguardando_remarcacao'].includes(a.status)&&a.data>=tk);
  const sum=(arr,f)=>arr.reduce((s,x)=>s+Number(f(x)||0),0), revenue=sum(done,a=>a.valor_final);
  const visits={}; done.forEach(a=>{ const v=visits[a.cliente_id]||(visits[a.cliente_id]={name:a.cliente,phone:a.telefone,n:0,spent:0}); v.n++; v.spent+=Number(a.valor_final); });
  const loyal=Object.values(visits).sort((x,y)=>y.n-x.n||y.spent-x.spent);
  const firstSeen={}; rows.filter(a=>a.status==='concluido').forEach(a=>{ if(!firstSeen[a.cliente_id]||a.data<firstSeen[a.cliente_id]) firstSeen[a.cliente_id]=a.data; });
  const byBarber=P.profs.map(p=>{ const d=done.filter(a=>a.profissional_id===p.id); return {p,n:d.length,rev:sum(d,a=>a.valor_final)}; }).filter(x=>x.n||x.p.ativo);
  const bySvc={}; done.forEach(a=>{ const f=Number(a.valor_cheio)?Number(a.valor_final)/Number(a.valor_cheio):1; (a.servicos||[]).forEach(s=>{ const o=bySvc[s.nome]||(bySvc[s.nome]={name:s.nome,n:0,rev:0}); o.n++; o.rev+=Number(s.preco)*f; }); });
  const busyL=done.concat(up), byDow=[1,2,3,4,5,6,0].map(d=>({d,n:busyL.filter(a=>parseISO(a.data).getDay()===d).length})).filter(x=>x.n);
  const hours={}; busyL.forEach(a=>{ const h=Math.floor(toMin(hm(a.hora))/60); hours[h]=(hours[h]||0)+1; });
  return {done,noshow,canc,up,revenue,forecast:sum(up,a=>a.valor_final),clients:Object.keys(visits).length,
    newClients:Object.keys(visits).filter(c=>firstSeen[c]&&firstSeen[c].slice(0,7)===ym).length,loyal,byBarber,
    bySvc:Object.values(bySvc).sort((a,b)=>b.n-a.n),byDow,hours,discount:sum(done,a=>Number(a.valor_cheio)-Number(a.valor_final)),
    returners:loyal.filter(v=>v.n>=2).length,ticket:done.length?revenue/done.length:0,noshowRate:pct(noshow.length,done.length+noshow.length)};
}
function delta(cur,prev){ if(!prev&&!cur) return ''; if(!prev) return `<span class="delta up">novo</span>`; const d=Math.round((cur-prev)/prev*100); return `<span class="delta ${d>0?'up':d<0?'down':'eq'}">${d>0?'▲':d<0?'▼':'='} ${Math.abs(d)}%</span>`; }
function hbars(rows){ const max=Math.max(1,...rows.map(r=>r.val)); return rows.map(r=>`<div class="hb"><span>${r.label}</span><span class="tr"><i style="width:${Math.max(1,r.val/max*100)}%"></i></span><span class="v">${r.txt}</span></div>`).join(''); }

function drawPoster(url){
  const cv=$('#poster'); if(!cv) return; const x=cv.getContext('2d'), W=cv.width, H=cv.height;
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#16130e'); g.addColorStop(1,'#0b0a08'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.strokeStyle='#c9a45c'; x.lineWidth=4; x.strokeRect(36,36,W-72,H-72); x.lineWidth=1.5; x.strokeRect(52,52,W-104,H-104);
  const finish=img=>{
    if(img){ const r=150,cx=W/2,cy=250; x.save(); x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.clip(); const s=Math.max(2*r/img.width,2*r/img.height); x.drawImage(img,cx-img.width*s/2,cy-img.height*s/2-6,img.width*s,img.height*s); x.restore(); x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.strokeStyle='#c9a45c'; x.lineWidth=5; x.stroke(); }
    x.fillStyle='#f3ead8'; x.textAlign='center'; x.font='500 74px Oswald, sans-serif'; x.fillText('AGENDE SEU HORÁRIO',W/2,520);
    x.fillStyle='#a2998a'; x.font='400 36px Inter, sans-serif'; x.fillText('Aponte a câmera do celular para o código',W/2,580);
    const tmp=$('#qrtmp'); tmp.innerHTML=''; let qc=null;
    try{ new QRCode(tmp,{text:url,width:560,height:560,colorDark:'#0d0c0a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); qc=tmp.querySelector('canvas'); }catch(e){}
    const qs=600,qx=(W-qs)/2,qy=630; x.fillStyle='#fff'; x.beginPath(); x.roundRect?x.roundRect(qx-20,qy-20,qs+40,qs+40,28):x.rect(qx-20,qy-20,qs+40,qs+40); x.fill();
    if(qc) x.drawImage(qc,qx+20,qy+20,qs-40,qs-40);
    x.fillStyle='#e6cd94'; x.font='600 40px Inter, sans-serif'; x.fillText('Rápido • Sem cadastro • 24 horas',W/2,1340);
    x.fillStyle='#6f685c'; x.font='400 26px Inter, sans-serif'; x.fillText('Confirmação e lembrete pelo WhatsApp',W/2,1385);
    x.fillStyle='#8a7a58'; x.font='400 22px Inter, sans-serif'; x.fillText('Sistema por '+GESTORA,W/2,1428);
  };
  const img=new Image(); img.onload=()=>finish(img); img.onerror=()=>finish(null); img.src=SLUG==='impacto'?LOGO:(EMP.logo_url||LOGO);
}

      <div class="row mt8" style="background:var(--card2);border-radius:10px;padding:10px 12px"><span class="grow small">📊 <b>Dono</b>: relatório mensal</span><button class="sw ${b.dono?'on':''}" data-pb="${b.id}|dono"></button></div>
      <div class="row mt8" style="background:var(--card2);border-radius:10px;padding:10px 12px"><span class="grow small">👥 Vê agenda e mensagens de todos</span><button class="sw ${b.ver_todos?'on':''}" data-pb="${b.id}|ver_todos"></button></div>
      ${b.user_id?'<p class="tiny dim mt8">✅ Já fez login</p>':'<p class="tiny dim mt8">Ainda não fez login</p>'}</div>`).join('')}
    <button class="btn sm ghost mt12" id="padd">+ Adicionar barbeiro</button></div></div>
  <div class="sect"><h3>Fidelidade (mesmo mês)</h3><div class="card"><div class="grid2"><label class="f"><span>Desconto na 2ª visita (%)</span><input type="number" data-e="desconto_2" value="${emp.desconto_2}"></label><label class="f"><span>A partir da 3ª visita (%)</span><input type="number" data-e="desconto_3" value="${emp.desconto_3}"></label></div></div></div>
  <div class="sect"><h3>Empresa e links</h3><div class="card"><label class="f"><span>Nome</span><input data-e="nome" value="${esc(emp.nome)}"></label><label class="f"><span>WhatsApp da empresa</span><input data-e="whatsapp" value="${esc(emp.whatsapp||'')}"></label>
    <div class="links"><div class="row between"><div class="grow"><b>Clientes</b><br><code>${esc(linkCliente())}</code></div></div><div class="row between"><div class="grow"><b>Barbeiros</b><br><code>${esc(linkCliente())}#profissional</code></div></div><div class="row between" style="border:0"><div class="grow"><b>Administrador</b><br><code>${esc(linkCliente())}#admin</code></div></div></div></div></div>
  </div>`;
  const upd=async(table,id,patch,msg)=>{ const {error}=await sb.from(table).update(patch).eq('id',id); if(error) toast('Erro: '+error.message); else { toast(msg||'Salvo'); EMP=await rpc('public_empresa',{p_slug:SLUG})||EMP; } };
  app.querySelectorAll('[data-slot]').forEach(b=>b.onclick=async()=>{ await upd('empresas',emp.id,{duracao_min:+b.dataset.slot},`Atendimentos de ${b.dataset.slot} min`); viewAdmin(); });
  app.querySelectorAll('[data-wd]').forEach(b=>b.onclick=async()=>{ const d=+b.dataset.wd; const ds=emp.dias_semana.includes(d)?emp.dias_semana.filter(x=>x!==d):emp.dias_semana.concat(d); await upd('empresas',emp.id,{dias_semana:ds}); viewAdmin(); });
  app.querySelectorAll('[data-e]').forEach(el=>el.onchange=()=>upd('empresas',emp.id,{[el.dataset.e]:el.type==='number'?Number(el.value):el.value}));
  app.querySelectorAll('[data-s]').forEach(el=>el.onchange=()=>upd('servicos',el.dataset.s,{[el.dataset.f]:['preco','blocos'].includes(el.dataset.f)?Number(el.value):el.value},'Serviço salvo'));
  app.querySelectorAll('[data-sact]').forEach(b=>b.onclick=async()=>{ const s=S.find(x=>x.id===b.dataset.sact); await upd('servicos',s.id,{ativo:!s.ativo}); viewAdmin(); });
  $('#sadd').onclick=async()=>{ const {error}=await sb.from('servicos').insert({empresa_id:emp.id,nome:'Novo serviço',preco:30,blocos:1,icone:'💈',ordem:S.length+1}); if(error) toast('Erro: '+error.message); viewAdmin(); };
  app.querySelectorAll('[data-p]').forEach(el=>el.onchange=()=>upd('profissionais',el.dataset.p,{[el.dataset.f]:el.dataset.f==='email'?el.value.trim().toLowerCase():el.value},'Barbeiro salvo'));
  app.querySelectorAll('[data-pb]').forEach(b=>b.onclick=async()=>{ const [id,f]=b.dataset.pb.split('|'); const p=PR.find(x=>x.id===id); await upd('profissionais',id,{[f]:!p[f]}); viewAdmin(); });
  app.querySelectorAll('[data-ph]').forEach(inp=>inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return; try{ const url=await resizeImage(f,360); await upd('profissionais',inp.dataset.ph,{foto_url:url},'Foto salva'); viewAdmin(); }catch(e){ toast('Não consegui ler essa imagem'); } });
  app.querySelectorAll('[data-phx]').forEach(b=>b.onclick=async()=>{ await upd('profissionais',b.dataset.phx,{foto_url:null}); viewAdmin(); });
  $('#padd').onclick=async()=>{ const {data:np,error}=await sb.from('profissionais').insert({empresa_id:emp.id,nome:'Novo barbeiro',ordem:PR.length+1}).select().single(); if(error) return toast('Erro: '+error.message);
    const ws=weekStart(hoje()); await rpc('gerar_semana_padrao',{p_prof:np.id,p_segunda:ws}); await rpc('gerar_semana_padrao',{p_prof:np.id,p_segunda:addISO(ws,7)}); toast('Barbeiro criado'); viewAdmin(); };
}

/* =========================================================================
   INÍCIO
   ========================================================================= */
(async function start(){
  loading();
  try{ EMP=await rpc('public_empresa',{p_slug:SLUG}); }catch(e){ app.innerHTML=`<div class="wrap"><div class="empty mt24">Sem conexão com o servidor. Verifique a internet e recarregue a página.</div></div>`; return; }
  if(!EMP){ app.innerHTML=`<div class="wrap"><div class="empty mt24">Empresa não encontrada.</div></div>`; return; }
  document.title = EMP.nome + ' · Agendamento';
  // Volta do link de acesso enviado por e-mail (tokens no endereço)
  const hp=new URLSearchParams(location.hash.slice(1));
  if(hp.get('access_token')){
    try{ await sb.auth.setSession({access_token:hp.get('access_token'),refresh_token:hp.get('refresh_token')}); }catch(e){}
    history.replaceState(null,'',location.pathname+location.search+'#profissional');
  } else if(hp.get('error') || hp.get('error_description')){
    history.replaceState(null,'',location.pathname+location.search+'#profissional');
    setTimeout(()=>toast('Link de acesso expirado ou já usado. Peça um novo.'),600);
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await afterLogin();
  render();
})();

</script>
</body>
</html>
